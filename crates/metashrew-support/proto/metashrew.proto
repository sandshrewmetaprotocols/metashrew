syntax = "proto3";

package metashrew;

message KeyValueFlush {
  repeated bytes list = 1;
}

// Metadata about a view function
message ViewFunction {
  // Name of the view function
  string name = 1;
  
  // Input type (protobuf message type)
  string input_type = 2;
  
  // Output type (protobuf message type)
  string output_type = 3;
}

// Metadata about an indexer
message IndexerMetadata {
  // Version of the compiler used to build the indexer
  string compiler_version = 1;

  // Version of rustc used to build the indexer
  string rustc_version = 2;

  // List of view functions exported by the indexer
  repeated ViewFunction view_functions = 3;
}

// =============================================================================
// View-mode syscalls (v10).
//
// `__flush` is currently a no-op when bound by `setup_linker_view` — view
// calls don't have a write path. We reuse the same wasm ABI symbol
// (`__flush(ptr: i32)`) to multiplex view-only host capabilities. The
// payload at `ptr` is decoded as `ViewSyscall` in view mode (in indexer
// mode it stays the existing `KeyValueFlush`). If decoding as
// `ViewSyscall` fails, the host falls back to the legacy no-op for
// forward compatibility — wasm that doesn't know about syscalls is
// unaffected.
//
// Responses (where applicable) are written by the host directly into
// wasm linear memory at `response_ptr` as `[u32 LE: len | bytes]`.
// The wasm pre-allocates this buffer and encodes the pointer/cap in
// the request. No change to `__flush`'s `(i32) -> ()` signature.
//
// Determinism note: view calls must return identical bytes on every
// node serving the same height. Syscalls that touch host-shared state
// (cache, threads) are perf-only — same logical inputs must produce
// the same logical output regardless of cache hit/miss or thread
// scheduling. The wasm author is responsible for honoring that.
// =============================================================================

message ViewSyscall {
  oneof request {
    CacheGet     cache_get    = 1;
    CachePut     cache_put    = 2;
    ThreadSpawn  thread_spawn = 3;
    ThreadJoin   thread_join  = 4;
  }
  // Pre-allocated response buffer in wasm linear memory. Host writes
  // `[u32 LE: response_len | response_bytes]` starting at this offset.
  // If the response would overflow `response_max`, the host writes
  // length=0 (empty response) and the syscall is treated as failed.
  uint32 response_ptr = 100;
  uint32 response_max = 101;
}

message CacheGet {
  // Opaque cache key. The wasm should include any inputs that affect
  // the cached value (height, request shape hash, etc.) to keep the
  // entry deterministic.
  bytes key = 1;
}

message CachePut {
  bytes key   = 1;
  bytes value = 2;
  // Optional TTL in seconds. 0 = no TTL (entry lives until LRU eviction).
  uint32 ttl_seconds = 3;
}

// Step 4 placeholder — host wires ENOSYS until view-threads lands.
message ThreadSpawn {
  uint32 fn_idx = 1;
  uint32 arg    = 2;
}

// Step 4 placeholder.
message ThreadJoin {
  uint32 thread_id = 1;
}

// =============================================================================
// Indexer-mode syscalls (v10).
//
// `__flush` in indexer mode normally accepts a `KeyValueFlush` protobuf
// (legacy semantic: commit these k/v pairs to the version chain). To
// add new host capabilities to the consensus-critical indexer path
// without breaking the existing ABI, we multiplex the same `__flush`
// entry point with a **byte-peek discriminator** scheme:
//
//   * Byte 0 == 0x01     ->  rest of buf is `IndexerSyscall` protobuf
//   * Byte 0 >= 0x08     ->  whole buf is legacy `KeyValueFlush` protobuf
//   * Byte 0 in [0..0x08) and != 0x01 -> reserved for future dispatch tags
//
// Why byte-peek instead of the view-side try-decode-fallback? Protobuf
// field number 0 is forbidden, so any valid encoded protobuf starts at
// byte >= 0x08 (lowest tag = field 1 wire-type 0 = 0x08). Reserving
// bytes 0x00..0x08 as dispatch tags is unambiguous AND avoids field-
// tag collision risk between KeyValueFlush (field 1) and any
// IndexerSyscall payload that also uses field 1.
//
// Determinism: unlike ViewSyscall (perf-only), IndexerSyscall opcodes
// directly affect on-chain state. Every opcode MUST be either
// (a) byte-for-byte deterministic given the same inputs, or
// (b) explicitly host-validated for deterministic merge (e.g. the
//     Block-STM scheduler in syscall step 5 ensures parallel
//     tx-execution produces the same final state as sequential).
//
// Wasm-side ergonomics: the wasm wrapper prepends the magic byte to
// the encoded IndexerSyscall before invoking __flush. The host strips
// the magic byte before decoding, so the proto payload itself is just
// the IndexerSyscall message bytes.
// =============================================================================

message IndexerSyscall {
  oneof request {
    Noop                noop           = 1;
    BatchGet            batch_get      = 2;
    IndexerThreadSpawn  thread_spawn   = 3;
    IndexerThreadJoin   thread_join    = 4;
    ConflictRead        conflict_read  = 5;
    ConflictWrite       conflict_write = 6;
    // Reserved future opcodes:
    //   7  PipelineHint   (wasm-side advisory on commit pipelining)
  }
  // Pre-allocated response buffer in wasm linear memory. Host writes
  // `[u32 LE: response_len | response_bytes]` starting at this offset.
  // Many opcodes (e.g. ThreadSpawn) don't need a response; those should
  // set response_ptr=0 and the host will skip the write.
  uint32 response_ptr = 100;
  uint32 response_max = 101;
}

// Trivial no-op opcode used by tests to exercise the dispatch path
// without any host-side side effects. Safe to leave in the wire format
// permanently — wasm should never invoke it in prod.
message Noop {}

// Batch point-read at the indexer's read height (H-1 if processing
// block H, mirroring __get's per-block semantics — see
// setup_linker_indexer's __get handler in runtime.rs).
//
// Win: collapses N (wasm -> host __get) round-trips into one
// (wasm -> host __flush) round-trip. The host still walks the version
// chain once per key (binary search via get_at_height) — true I/O
// pipelining lands in a follow-up via a multi_get_at_height trait
// method that backends like RocksDB can override.
//
// Determinism: read at the indexer block's start-of-block snapshot is
// deterministic by construction (same chain, same key, same height).
message BatchGet {
  repeated bytes keys = 1;
}

// One entry per request key (response.entries.len() == request.keys.len()).
message BatchGetEntry {
  // True if the key had a value at the read height. False = miss.
  // Distinguishes "present but empty value" from "missing"; the
  // `value` field alone is ambiguous.
  bool  present = 1;
  // The stored value. Always empty bytes when !present.
  bytes value   = 2;
}

message BatchGetResponse {
  repeated BatchGetEntry entries = 1;
}

// =============================================================================
// Block-STM opcodes (v10 syscalls #3-#6). Lets alkanes-v3 opt into
// per-tx parallel execution on the indexer worker pool.
//
// The wasm pattern is:
//
//   for tx in block.txs() {
//       let tid = __idx_spawn(fn_idx=tx_handler, arg=tx_seq);
//       handles.push(tid);
//   }
//   for tid in handles { __idx_join(tid); }
//
// Inside the spawned tx-handler, all storage I/O goes through
// `__idx_conflict_read` / `__idx_conflict_write` instead of
// `__get` / `__flush`. These are instrumented — reads register a
// dependency in this tx's read-set, writes stage into the per-block
// MvMemory at this tx's sequence number. The scheduler (separate
// commit) validates read-sets, re-executes losers, and merges
// the final write-sets into the block's WriteBatch in canonical
// tx order.
//
// Determinism: same as ViewSyscall threads (each spawned handler
// runs on a host-managed OS thread with its own wasmtime Store
// and isolated linear memory). wasm_threads(true) STAYS OFF on the
// indexer engine — there's no shared-memory wasm; threading is a
// host-side orchestration concept and the wasm only sees the
// thread_id u32.
// =============================================================================

// Schedule a tx-handler closure on the indexer worker pool.
// `fn_idx` indexes into __indirect_function_table — the host spawns
// a fresh Store, instantiates the module, calls fn_table[fn_idx](arg).
// `arg` is opaque to the host; wasm typically passes tx_seq so the
// handler can look up its tx-specific work in its own staging
// structure.
//
// Returns: u32 thread_id, written to response_ptr as
// `[u32 LE: 4 | thread_id_bytes]`. 0 = INVALID_THREAD_ID (spawn
// failed; the registry isn't installed on this Store, or the engine
// rejected the instantiation).
//
// Named `IndexerThreadSpawn` (not `ThreadSpawn`) to avoid
// collision with the view-side `ThreadSpawn` message in the same
// proto package. The wasm-side wrapper aliases the prost type to
// a shorter name.
message IndexerThreadSpawn {
  uint32 fn_idx = 1;
  uint32 arg    = 2;
}

// Block until the named handler finishes, return its exit code.
// Returns: i32 exit_code as `[u32 LE: 4 | i32_le_bytes]`.
// i32::MIN = INVALID_EXIT_CODE (unknown id, already joined,
// panicked, or aborted).
message IndexerThreadJoin {
  uint32 thread_id = 1;
}

// Instrumented read: looks in MvMemory for a strictly-earlier-tx
// write to `key`; falls back to disk via get_at_height(H-1) if
// none. Records the resolved Version in this tx's ConflictTracker
// so the scheduler can later re-validate.
//
// `tx_seq` is implicit: the host pulls it from the spawned Store's
// State. Wasm doesn't need to pass it. (Belt-and-suspenders: if
// the Store has no tx_seq set, the opcode falls back to a normal
// __get to avoid silently dropping reads in non-parallel paths.)
//
// Returns: the value bytes, written as `[u32 LE: len | value]`.
// len=0 distinguishes "key has no value at H-1" from "value is
// empty bytes" via the wasm-side wrapper convention (wasm tracks
// the request key, so it knows what it asked for).
message ConflictRead {
  bytes key = 1;
}

// Instrumented write: stages `value` at `key` in this tx's slot of
// MvMemory. Does NOT touch the read-set (writes aren't validated;
// only reads are). `tx_seq` is implicit (Store-attached).
//
// No response needed; binding sets `response_ptr = 0` typically.
message ConflictWrite {
  bytes key   = 1;
  bytes value = 2;
}
